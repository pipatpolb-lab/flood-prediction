<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบริหารจัดการน้ำ (Server Mode)</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0056b3; }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; }
        select, button { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; font-family: 'Sarabun', sans-serif; font-size: 16px; }
        button { grid-column: span 2; background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:disabled { background-color: #6c757d; }
        
        /* ส่วนแสดงผล */
        .result-section { display: none; margin-top: 20px; padding: 20px; border-radius: 8px; animation: fadeIn 0.5s; }
        .alert-danger { background-color: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .alert-normal { background-color: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        
        /* กราฟน้ำ */
        .dam-container { display: flex; justify-content: center; margin-top: 20px; }
        .dam-visual { width: 150px; height: 200px; background: #e9ecef; position: relative; border: 2px solid #ced4da; border-radius: 0 0 10px 10px; overflow: hidden; }
        .water { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; transition: height 1s ease-in-out; display: flex; justify-content: center; align-items: flex-end; color: white; font-weight: bold; text-shadow: 0 1px 2px rgba(0,0,0,0.5); padding-bottom: 5px; }
        .limit-line { position: absolute; bottom: 70%; width: 100%; height: 2px; background: red; z-index: 10; border-bottom: 1px dashed white; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<div class="container">
    <h1>💧 ระบบพยากรณ์น้ำท้ายเขื่อน (Server-Side)</h1>
    
    <div class="control-panel">
        <div>
            <label>📍 เลือกจังหวัด:</label>
            <select id="provinceSelect"></select>
        </div>
        <div>
            <label>🌊 เลือกเขื่อน:</label>
            <select id="damSelect">
                <option value="เขื่อนภูมิพล">เขื่อนภูมิพล</option>
                <option value="เขื่อนสิริกิติ์">เขื่อนสิริกิติ์</option>
                <option value="เขื่อนศรีนครินทร์">เขื่อนศรีนครินทร์</option>
                <option value="เขื่อนวชิราลงกรณ">เขื่อนวชิราลงกรณ</option>
                <option value="เขื่อนอุบลรัตน์">เขื่อนอุบลรัตน์</option>
                <option value="เขื่อนป่าสักชลสิทธิ์">เขื่อนป่าสักชลสิทธิ์</option>
                <option value="เขื่อนขุนด่านปราการชล">เขื่อนขุนด่านปราการชล</option>
                <option value="เขื่อนลำตะคอง">เขื่อนลำตะคอง</option>
            </select>
        </div>
        <button id="analyzeBtn" onclick="analyzeSituation()">เริ่มประมวลผล</button>
    </div>

    <div id="resultBox" class="result-section">
        <h3>📊 ผลการวิเคราะห์</h3>
        <p id="resultText"></p>
        
        <div class="dam-container">
            <div class="dam-visual">
                <div class="limit-line" title="เกณฑ์เฝ้าระวัง 70%"></div>
                <div class="water" id="waterLevel">0%</div>
            </div>
        </div>
    </div>
    
    <div id="weatherWidgetBox" style="margin-top:20px; text-align: center;"></div>
</div>

<script>
    // ข้อมูลจังหวัด
    const provinces = ['กรุงเทพมหานคร', 'กาญจนบุรี', 'ขอนแก่น', 'เชียงใหม่', 'ตาก', 'นครนายก', 'นครราชสีมา', 'ลพบุรี', 'อุตรดิตถ์', 'อุบลราชธานี'];
    const pvSelect = document.getElementById('provinceSelect');
    provinces.sort().forEach(p => {
        let opt = document.createElement('option');
        opt.value = p; opt.text = p; pvSelect.add(opt);
    });

    async function analyzeSituation() {
        const btn = document.getElementById('analyzeBtn');
        const resultBox = document.getElementById('resultBox');
        const widgetBox = document.getElementById('weatherWidgetBox');
        
        const damName = document.getElementById('damSelect').value;
        const province = document.getElementById('provinceSelect').value;

        // 1. UI Loading
        btn.innerHTML = '⏳ กำลังติดต่อ Server (อาจใช้เวลา 5-10 วินาที)...';
        btn.disabled = true;
        resultBox.style.display = 'none';
        
        // แสดง Widget อากาศ (ให้ดูระหว่างรอ)
        widgetBox.innerHTML = `<iframe src="https://www.tmd.go.th/weatherForecast7DaysWidget?province=${province}" width="100%" height="380" frameborder="0"></iframe>`;

        try {
            // 2. ส่งข้อมูลไปให้ Python หลังบ้าน
            const response = await fetch('/api/analyze', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ dam_name: damName, province: province })
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error || 'Server Error');
            }

            const data = await response.json();

            // 3. แสดงผลลัพธ์ที่ได้จาก Python
            const statusClass = data.status === 'danger' ? 'alert-danger' : 'alert-normal';
            resultBox.className = `result-section ${statusClass}`;
            resultBox.style.display = 'block';

            document.getElementById('resultText').innerHTML = `
                <strong>📍 เขื่อน:</strong> ${damName}<br>
                <strong>🌧️ โอกาสฝนตก:</strong> ${data.rain_percent}% (ในอีก ${data.days_ahead} วัน)<br>
                <strong>💧 ปริมาณน้ำ:</strong> ${data.storage.toLocaleString()} ล้าน ลบ.ม. (${data.dam_percent}%)<br>
                <hr>
                <strong>📢 คำแนะนำ:</strong> ${data.advice}
            `;

            // Animation กราฟ
            const waterDiv = document.getElementById('waterLevel');
            waterDiv.style.height = `${data.dam_percent}%`;
            waterDiv.innerText = `${data.dam_percent}%`;
            waterDiv.style.backgroundColor = data.dam_percent >= 70 ? '#dc3545' : '#007bff';

        } catch (error) {
            alert("เกิดข้อผิดพลาด: " + error.message);
        } finally {
            btn.innerHTML = 'เริ่มประมวลผล';
            btn.disabled = false;
        }
    }
</script>

</body>
</html>
